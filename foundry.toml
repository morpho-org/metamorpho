[profile.default]
libs = ["lib"]
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
additional_compiler_profiles = [
    { name = "v1.0", evm_version = "paris" },
    { name = "public-allocator", optimizer_runs = 999999, evm_version = "paris", bytecode_hash = "None" },
    { name = "v1.1", evm_version = "cancun", bytecode_hash = "None" },
]
compilation_restrictions = [
    { paths = "src/MetaMorpho*.sol", optimizer_runs = 200, evm_version = "paris", bytecode_hash = "Ipfs" },
    { paths = "src/periphery/public-allocator/**", optimizer_runs = 999999, evm_version = "paris", bytecode_hash = "None" },
    { paths = "src/v1.1/**", evm_version = "cancun", bytecode_hash = "None" },
    { paths = "test/v1.1/**", evm_version = "cancun", bytecode_hash = "None" },
]

[profile.default.fmt]
wrap_comments = true

[lint]
exclude_lints = [
    "arbitrary-send-erc20",
    "arbitrary-send-eth",
    "asm-keccak256",
    "block-timestamp",
    "boolean-cst",
    "calls-loop",
    "costly-loop",
    "custom-errors",
    "cyclomatic-complexity",
    "divide-before-multiply",
    "ecrecover",
    "encode-packed-collision",
    "erc20-unchecked-transfer",
    "incorrect-shift",
    "inline-assembly",
    "internal-function-used-once",
    "literal-instead-of-constant",
    "low-level-calls",
    "missing-events-access-control",
    "missing-zero-check",
    "mixed-case-variable",
    "multi-contract-file",
    "pragma-inconsistent",
    "reentrancy-events",
    "reentrancy-no-eth",
    "require-revert-in-loop",
    "screaming-snake-case-const",
    "screaming-snake-case-immutable",
    "solmate-safe-transfer-lib",
    "too-many-digits",
    "unaliased-plain-import",
    "uninitialized-local",
    "unsafe-cheatcode",
    "unsafe-typecast",
    "unused-import",
    "unused-return",
    "unwrapped-modifier-logic",
]

# Lint test/ as ordinary Solidity instead of applying Forge's test-only rule filter.
[profile.lint-test]
test = ".forge-lint-unused"

[profile.lint-test.lint]
exclude_lints = [
    "arbitrary-send-erc20",
    "arbitrary-send-eth",
    "asm-keccak256",
    "block-timestamp",
    "boolean-cst",
    "calls-loop",
    "costly-loop",
    "custom-errors",
    "cyclomatic-complexity",
    "divide-before-multiply",
    "ecrecover",
    "empty-block",
    "encode-packed-collision",
    "environment-read-across-mutation",
    "erc20-unchecked-transfer",
    "function-init-state",
    "incorrect-shift",
    "inline-assembly",
    "internal-function-used-once",
    "literal-instead-of-constant",
    "locked-ether",
    "low-level-calls",
    "missing-events-access-control",
    "missing-inheritance",
    "missing-zero-check",
    "mixed-case-variable",
    "multi-contract-file",
    "named-struct-fields",
    "pragma-inconsistent",
    "reentrancy-events",
    "reentrancy-no-eth",
    "require-revert-in-loop",
    "return-bomb",
    "screaming-snake-case-const",
    "screaming-snake-case-immutable",
    "solmate-safe-transfer-lib",
    "too-many-digits",
    "unaliased-plain-import",
    "uninitialized-local",
    "uninitialized-state",
    "unsafe-cheatcode",
    "unsafe-typecast",
    "unused-import",
    "unused-return",
    "unwrapped-modifier-logic",
]
