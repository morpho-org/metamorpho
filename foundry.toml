[profile.default]
ignored_warnings_from = ["lib"]
libs = ["lib"]
evm_version = "paris"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
additional_compiler_profiles = [
    { name = "public-allocator", optimizer_runs = 999999, bytecode_hash = "None" },
]
compilation_restrictions = [
    { paths = "src/periphery/public-allocator/**", optimizer_runs = 999999, bytecode_hash = "None" },
]

[lint]
exclude_lints = [
    "unaliased-plain-import",
    "unused-import",
    "erc20-unchecked-transfer",
    "unwrapped-modifier-logic",
    "mixed-case-variable",
    "unsafe-typecast",
    "asm-keccak256",
    "block-timestamp",
    "require-revert-in-loop",
    "calls-loop",
    "reentrancy-events",
    "uninitialized-local",
    "reentrancy-no-eth",
    "missing-zero-check",
    "unused-return",
    "arbitrary-send-eth",
    "arbitrary-send-erc20",
]
