[profile.default]
libs = ["lib"]
evm_version = "paris"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
additional_compiler_profiles = [
    { name = "public-allocator", optimizer_runs = 999999, bytecode_hash = "None" },
]
compilation_restrictions = [
    { paths = "src/periphery/public-allocator/**", optimizer_runs = 999999, bytecode_hash = "None" },
]

[profile.default.fmt]
wrap_comments = true

[lint]
exclude_lints = [
    "unaliased-plain-import",
    "unused-import",
    "erc20-unchecked-transfer",
    "unwrapped-modifier-logic",
    "mixed-case-variable",
    "unsafe-typecast",
    "asm-keccak256",
    "block-timestamp",
]
