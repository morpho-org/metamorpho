[profile.default]
libs = ["lib"]
evm_version = "paris"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
additional_compiler_profiles = [
    { name = "public-allocator", optimizer_runs = 999999, bytecode_hash = "None" },
]
compilation_restrictions = [
    { paths = "src/periphery/public-allocator/**", optimizer_runs = 999999, bytecode_hash = "None" },
]

[profile.default.fmt]
wrap_comments = true

[lint]
exclude_lints = [
    "unaliased-plain-import",
    "unused-import",
    "erc20-unchecked-transfer",
    "unwrapped-modifier-logic",
    "mixed-case-variable",
    "unsafe-typecast",
    "asm-keccak256",
    "block-timestamp",
    # Existing implementation baseline; enabling CI must preserve audited bytecode.
    "arbitrary-send-erc20",
    "arbitrary-send-eth",
    "calls-loop",
    "missing-zero-check",
    "reentrancy-events",
    "reentrancy-no-eth",
    "require-revert-in-loop",
    "uninitialized-local",
    "unused-return",
]

# Test-only baseline. Lists replace rather than extend the default exclusions.
# Lint test/ as ordinary Solidity instead of applying Forge's test-only rule filter.
[profile.lint-test]
test = ".forge-lint-unused"

[profile.lint-test.lint]
exclude_lints = [
    # Test stubs intentionally have empty bodies.
    "empty-block",
    "unaliased-plain-import",
    "unused-import",
    "erc20-unchecked-transfer",
    "unwrapped-modifier-logic",
    "mixed-case-variable",
    "unsafe-typecast",
    "asm-keccak256",
    "block-timestamp",
    "arbitrary-send-erc20",
    "arbitrary-send-eth",
    "calls-loop",
    "missing-zero-check",
    "reentrancy-events",
    "reentrancy-no-eth",
    "require-revert-in-loop",
    "uninitialized-local",
    "unused-return",
    "environment-read-across-mutation",
]
