[profile.default]
ignored_error_codes_from = [["test", ["code-size", "init-code-size"]]]
ignored_warnings_from = ["lib"]
libs = ["lib"]
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
additional_compiler_profiles = [
    { name = "v1.0", evm_version = "paris", bytecode_hash = "Ipfs" },
    { name = "public-allocator", optimizer_runs = 999999, evm_version = "paris", bytecode_hash = "None" },
    { name = "v1.1", evm_version = "cancun", bytecode_hash = "None" },
]
compilation_restrictions = [
    { paths = "src/v1.0/MetaMorpho*.sol", optimizer_runs = 200, evm_version = "paris", bytecode_hash = "Ipfs" },
    { paths = "src/periphery/public-allocator/**", optimizer_runs = 999999, evm_version = "paris", bytecode_hash = "None" },
    { paths = "src/v1.1/**", evm_version = "cancun", bytecode_hash = "None" },
    { paths = "test/v1.1/**", evm_version = "cancun", bytecode_hash = "None" },
]

[profile.default.fuzz]
runs = 1024

[lint]
severity = ["high", "medium", "low", "info"]
exclude_lints = [
    "arbitrary-send-erc20",
    "block-timestamp",
    "boolean-cst",
    "calls-loop",
    "cyclomatic-complexity",
    "incorrect-shift",
    "inline-assembly",
    "internal-function-used-once",
    "literal-instead-of-constant",
    "low-level-calls",
    "missing-events-access-control",
    "missing-zero-check",
    "mixed-case-variable",
    "multi-contract-file",
    "pragma-inconsistent",
    "reentrancy-events",
    "require-revert-in-loop",
    "screaming-snake-case-immutable",
    "too-many-digits",
    "uninitialized-local",
    "unsafe-cheatcode",
    "unused-return",
    # Those exclusions are added to not add inline lint suppressors in the following contracts: MetaMorpho, PublicAllocator, MetaMorphoV1_1.
    "arbitrary-send-eth",
    "missing-inheritance",
    "reentrancy-no-eth",
    "unsafe-typecast",
]
