name: Certora

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  matrix:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      confs: ${{ steps.list.outputs.confs }}
      confs-v1-1: ${{ steps.list.outputs.confs-v1-1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          echo "confs=$(find certora/v1.0/confs -type f -name '*.conf' | sed 's|^certora/v1.0/confs/||;s|\.conf$||' | sort | jq -nRc '[inputs]')" >> "$GITHUB_OUTPUT"
          echo "confs-v1-1=$(find certora/v1.1/confs -type f -name '*.conf' | sed 's|^certora/v1.1/confs/||;s|\.conf$||' | sort | jq -nRc '[inputs]')" >> "$GITHUB_OUTPUT"

  format:
    permissions:
      contents: read
    name: Certora formatting
    runs-on: ubuntu-latest
    steps:
      - name: Use Java 21
        run: echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install certora-cli
      - name: Run Certora Config Linter
        run: |
          find certora/v1.0/confs certora/v1.1/confs -type f -name '*.conf' | sort |
          while read -r file; do
            jq . "$file" | diff -u "$file" -
          done
      - name: Run Certora Specs Linter
        run: |
          find certora -type f -name '*.spec' | sort |
          while read -r file; do
            certoraCVLFormatter "$file" | diff -u "$file" -
          done

  verify:
    permissions:
      contents: read
    needs: [matrix, format]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        conf: ${{ fromJson(needs.matrix.outputs.confs) }}

    steps:
      - name: Use Java 21
        run: echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install certora
        run: pip install certora-cli

      - name: Install solc
        run: |
          echo "0.8.19 7a5c1d3dc9a8eba62bb2ec37192c9178ae5fe8a54a56e5573fd3c9c17cd9eb48
          0.8.21 f2857a898be15c69e8de5598dcd3f3e169e94964a0ce9a0bbb1b111f145a81df" |
          while read -r version sha256; do
            curl -fsSL -o solc "https://github.com/ethereum/solidity/releases/download/v$version/solc-static-linux"
            echo "$sha256  solc" | sha256sum --check --strict
            chmod +x solc
            sudo mv solc "/usr/local/bin/solc-$version"
          done

      - name: Apply munging
        run: make -C certora/v1.0 munged

      - name: Verify ${{ matrix.conf }} specification
        run: certoraRun "certora/v1.0/confs/$CONF.conf"
        env:
          CONF: ${{ matrix.conf }}
          CERTORAKEY: ${{ secrets.CERTORAKEY }}

  verify-v1-1:
    permissions:
      contents: read
    needs: [matrix, format]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        conf: ${{ fromJson(needs.matrix.outputs.confs-v1-1) }}

    steps:
      - name: Use Java 21
        run: echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install certora
        run: pip install certora-cli

      - name: Install solc
        run: |
          echo "0.8.19 7a5c1d3dc9a8eba62bb2ec37192c9178ae5fe8a54a56e5573fd3c9c17cd9eb48
          0.8.26 d5f23436f443edb85d8e76906d12f0a86ce0490e7663a9e608efeb7a93f149ef" |
          while read -r version sha256; do
            curl -fsSL -o solc "https://github.com/ethereum/solidity/releases/download/v$version/solc-static-linux"
            echo "$sha256  solc" | sha256sum --check --strict
            chmod +x solc
            sudo mv solc "/usr/local/bin/solc-$version"
          done

      - name: Apply munging
        run: make -C certora/v1.1 munged

      - name: Verify ${{ matrix.conf }} specification
        run: certoraRun "certora/v1.1/confs/$CONF.conf"
        env:
          CONF: ${{ matrix.conf }}
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
